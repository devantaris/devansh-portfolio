name: Sync Live Stats (GitHub & CodeChef)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest CodeChef Stats
        run: node scripts/update-codechef.mjs

      - name: Fetch Latest GitHub Contributions
        run: node scripts/fetch-github-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/codechef.json public/data/github-contributions.json public/blueprint.html public/blueprint/index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(stats): sync live CodeChef rating and GitHub contributions" && git push)
